<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalDock</title>
<style>/* Orca sets its theme on plugin frames as --orca-* variables and updates them in place; fallbacks are for the browser preview. */
:root {
  color-scheme: light dark;
  --ld-bg: var(--orca-background, #1e1e1e);
  --ld-fg: var(--orca-foreground, #e4e4e4);
  --ld-muted: var(--orca-muted-foreground, #9a9a9a);
  --ld-border: var(--orca-border, #3a3a3a);
  --ld-card: var(--orca-card, #252526);
  --ld-accent: var(--orca-accent, #2f2f33);
  --ld-primary: var(--orca-primary, #4c8dff);
  --ld-primary-fg: var(--orca-primary-foreground, #fff);
  --ld-danger: var(--orca-destructive, #e5484d);
  --ld-radius: var(--orca-radius, 6px);
  --ld-green: #3fb950;
  --ld-yellow: #d29922;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font: 13px/1.45 var(--orca-font-sans, system-ui, -apple-system, 'Segoe UI', sans-serif);
  color: var(--ld-fg);
  background: var(--ld-bg);
}
main { padding: 10px 12px 24px; }
h2 { font-size: 14px; margin: 4px 0 4px; word-break: break-all; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ld-muted); margin: 14px 0 4px; }
p { margin: 6px 0; }
code { font-size: 12px; word-break: break-all; }
.muted { color: var(--ld-muted); }
.small { font-size: 12px; }
.pad { padding: 4px 8px; }
.grow { flex: 1; min-width: 0; }

.btn {
  font: inherit; font-size: 12px; color: var(--ld-fg); background: var(--ld-accent);
  border: 1px solid var(--ld-border); border-radius: var(--ld-radius); padding: 3px 9px; cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { filter: brightness(1.15); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary { background: var(--ld-primary); color: var(--ld-primary-fg); border-color: transparent; }
.btn-danger { border-color: var(--ld-danger); color: var(--ld-danger); background: transparent; }

.input { width: 100%; margin: 8px 0 4px; padding: 5px 8px; font: inherit; color: var(--ld-fg); background: var(--ld-card); border: 1px solid var(--ld-border); border-radius: var(--ld-radius); }
.check { display: flex; gap: 6px; align-items: flex-start; margin: 6px 0; cursor: pointer; }

.toolbar { display: flex; gap: 6px; align-items: center; margin: 8px 0; }
.server-off { margin: -2px 0 8px; }
.list { list-style: none; margin: 0; padding: 0; }
.row { display: flex; gap: 8px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--ld-border); }
.row strong { word-break: break-all; }

.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot-on { background: var(--ld-green); }
.dot-off { background: var(--ld-muted); }

.empty { padding: 20px 4px; }
.empty .btn { margin-top: 8px; }
.empty .btn + .btn { margin-left: 6px; }
.gaps { padding-left: 18px; }
.gaps li { margin: 6px 0; }

.notice { display: flex; gap: 8px; align-items: flex-start; margin: 8px 12px 0; padding: 7px 9px; border-radius: var(--ld-radius); border: 1px solid var(--ld-border); background: var(--ld-card); }
main .notice { margin: 8px 0; }
.notice span { flex: 1; }
.notice .btn { padding: 0 6px; }
.notice-error { border-color: var(--ld-danger); }
.notice-success { border-color: var(--ld-green); }

.job { position: sticky; top: 0; z-index: 1; display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; padding: 8px 12px; background: var(--ld-card); border-bottom: 1px solid var(--ld-border); }
.job-text { display: flex; flex-direction: column; min-width: 0; }
.job-text span { color: var(--ld-muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { grid-column: 1 / -1; height: 3px; background: var(--ld-border); border-radius: 2px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--ld-primary); transition: width .2s; }
.bar-fill.indeterminate { animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }

.site { margin-bottom: 6px; }
.ddev { display: flex; gap: 8px; align-items: center; padding: 6px 0; }
.links { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.link {
  font: inherit; font-family: var(--orca-font-mono, ui-monospace, monospace); font-size: 12px; color: var(--ld-primary);
  background: none; border: 0; padding: 0; cursor: pointer; text-align: left; word-break: break-all; text-decoration: underline;
}
.link:hover { opacity: .85; }

.section { border-top: 1px solid var(--ld-border); margin: 0 -12px; }
.section > summary { display: flex; align-items: center; gap: 6px; padding: 6px 12px; cursor: pointer; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; list-style: none; }
.section > summary::-webkit-details-marker { display: none; }
.section > summary::before { content: '›'; display: inline-block; transition: transform .15s; }
.section[open] > summary::before { transform: rotate(90deg); }
.section-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 12px 8px; }
.badge { min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--ld-accent); text-align: center; font-weight: 500; }

.group-head { display: flex; align-items: center; gap: 6px; padding: 3px 12px; white-space: nowrap; }
.group-head:hover { background: var(--ld-accent); }
.group-toggle { flex: 1; min-width: 0; display: flex; gap: 4px; align-items: baseline; font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.group-name { overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.group .changes .change { padding-left: 34px; }
.btn-small { font-size: 11px; padding: 1px 7px; }

.changes { list-style: none; margin: 0; padding: 0; }
.change { display: flex; align-items: center; gap: 6px; padding: 2px 12px; white-space: nowrap; }
.change:hover { background: var(--ld-accent); }
.change .name { flex: none; }
.change .dir { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
.letter { width: 14px; text-align: center; font-weight: 700; font-size: 12px; }
.letter-added { color: var(--ld-green); }
.letter-modified { color: var(--ld-yellow); }
.letter-deleted { color: var(--ld-danger); }
.changes-busy .change:not(.change-syncing) { opacity: .5; }
.change-syncing .syncing { font-weight: 700; color: var(--ld-primary); animation: syncing 1s ease-in-out infinite; }
@keyframes syncing { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .change-syncing .syncing { animation: none; } }
</style>
</head>
